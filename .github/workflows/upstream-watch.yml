name: Upstream Release Watcher

# Detects new releases of the upstream JGR patch pack and, when one appears,
# merges it into the rolling `jgrpp` branch (keeping our mobile adaptations on
# conflict) and dispatches the Android + HarmonyOS release workflows so a new
# jgrpp-mobile-<version> is published automatically.
#
# Ordering matters: the merge is only PUSHED after the mobile-adaptation
# integrity check passes, and the version marker is written in that same
# later step — so a bad merge never marks itself as synced, and the next
# scheduled run retries until a human fixes it (alerted via issue).
#
# NOTE: This workflow never pushes to the upstream repository. It only pushes
# the merge + the version marker back to this repository (origin).

on:
  schedule:
    # Every 6 hours, offset to avoid the top of the hour.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force-merge and release this upstream version even if already synced (e.g. 0.73.2). Leave empty for normal watch mode.'
        required: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  UPSTREAM_REPO: JGRennison/OpenTTD-patches

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile repo
        uses: actions/checkout@v4
        with:
          ref: jgrpp
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve upstream latest release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            TAG="jgrpp-${{ github.event.inputs.force_version }}"
          else
            TAG=$(gh api repos/$UPSTREAM_REPO/releases/latest --jq '.tag_name')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#jgrpp-}" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $TAG"

      - name: Read last synced version
        id: last
        run: |
          LAST=$(cat .github/upstream-release 2>/dev/null || echo "")
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "Last synced: '${LAST}'"

      - name: Decide whether to act
        id: decide
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          LAST="${{ steps.last.outputs.last }}"
          FORCE="${{ github.event.inputs.force_version }}"
          if [ -z "$FORCE" ] && [ "$VERSION" = "$LAST" ]; then
            echo "Already synced to $VERSION; nothing to do."
            echo "do=no" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$FORCE" ]; then
              echo "Forced sync of $VERSION requested (marker says '$LAST')"
            else
              echo "New upstream $VERSION (was '$LAST')"
            fi
            echo "do=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into jgrpp (local)
        if: steps.decide.outputs.do == 'yes'
        run: |
          git config user.email "bot@jgrpp-mobile.local"
          git config user.name "jgrpp-mobile bot"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" \
            || git remote set-url upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --tags upstream "${{ steps.upstream.outputs.tag }}"
          # Keep our mobile adaptations on conflict; they live in isolated
          # files (harmony/, .github/, Android app shell) plus a handful of
          # targeted source edits that upstream is unlikely to touch.
          git merge -X ours --no-edit "${{ steps.upstream.outputs.tag }}"

      - name: Verify mobile adaptation survived the merge
        if: steps.decide.outputs.do == 'yes'
        run: |
          fail=0
          grep -q '__ANDROID__' src/video/sdl_v.cpp \
            || { echo "::error::src/video/sdl_v.cpp lost its __ANDROID__ touch-UI guards"; fail=1; }
          grep -q 'PerformanceElement::Video' src/video/sdl_v.cpp \
            || { echo "::error::src/video/sdl_v.cpp lost the jgrpp 0.73 enum-class fix"; fail=1; }
          grep -q 'if(NOT ANDROID)' cmake/FindICU.cmake \
            || { echo "::error::cmake/FindICU.cmake lost the Android pkg-config bypass"; fail=1; }
          test -f harmony/build-ohos.sh \
            || { echo "::error::harmony/build-ohos.sh (OHOS port) is missing"; fail=1; }
          test -f harmony/app/build-profile.json5 \
            || { echo "::error::harmony/app HAP project is missing"; fail=1; }
          test -f .github/workflows/android-release.yml \
            || { echo "::error::android-release.yml is missing"; fail=1; }
          test -f .github/workflows/ohos-release.yml \
            || { echo "::error::ohos-release.yml is missing"; fail=1; }
          exit $fail

      - name: Write marker and push merge
        if: steps.decide.outputs.do == 'yes'
        run: |
          printf '%s\n' "${{ steps.upstream.outputs.version }}" > .github/upstream-release
          git add .github/upstream-release
          git commit -m "Merge upstream ${{ steps.upstream.outputs.tag }} [bot]" || true
          git push origin jgrpp

      - name: Tag release branch marker
        if: steps.decide.outputs.do == 'yes'
        run: |
          git branch -f "jgrpp-${{ steps.upstream.outputs.version }}-mobile" jgrpp
          git push origin "jgrpp-${{ steps.upstream.outputs.version }}-mobile"

      - name: Dispatch Android + HarmonyOS release builds
        if: steps.decide.outputs.do == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.upstream.outputs.version }}"
          gh workflow run android-release.yml -f version="$VER" -f ref=jgrpp
          gh workflow run ohos-release.yml -f version="$VER" -f ref=jgrpp

      - name: Open alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream sync failed (${{ steps.upstream.outputs.version || 'unknown version' }})"
          BODY="Automatic upstream sync failed.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The version marker was NOT updated by this run, so the next
          scheduled watch will retry the same broken state every 6 hours.
          Fix the breakage on \`jgrpp\`, then dispatch **Upstream Release
          Watcher** with \`force_version\` set to re-run the sync."

          NUM=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // ""')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
